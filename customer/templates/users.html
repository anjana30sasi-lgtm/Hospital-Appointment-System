<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>MEMBERS</h1>
    <table>
        <tr>
            <td><b>Name</b></td>
            <td><b>Email</b></td>
            <td><b>Age</b></td>

        </tr>
        {% for x in data %}
        <tr>
            <td>{{ x.name }}</td>
            <td>{{ x.email }}</td>
            <td>{{ x.age }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
