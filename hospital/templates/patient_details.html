{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">My Patients</h2>

<table>

<tr>
    <th>Name</th>
    <th>Age</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Address</th>
</tr>

{% for patient in patients %}

<tr>

    <td>{{ patient.name }}</td>
    <td>{{ patient.age }}</td>
    <td>{{ patient.email }}</td>
    <td>{{ patient.phone }}</td>
    <td>{{ patient.address }}</td>

</tr>

{% empty %}

<tr>
    <td colspan="5">
        No Patients Found
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
