{% extends 'base.html' %}

{% block content %}

<h1 class="page-title">Doctor Details</h1>
<input type="text"
       placeholder="Search Doctor"
       class="search-box">
<table border="1">

    <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Specialization</th>
        <th>Email</th>
        <th>Phone</th>
    </tr>

    {% for doctor in doctors %}
    <tr>
        <td>{{ doctor.name }}</td>
        <td>{{ doctor.department }}</td>
        <td>{{ doctor.specialization }}</td>
       <td>
    <a href="mailto:{{ doctor.email }}">
        {{ doctor.email }}
    </a>
</td>
        <td>{{ doctor.phone }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
