{% extends 'base.html' %}

{% block content %}

<h2 class="form-title">Book Appointment</h2>

{% if form.non_field_errors %}
<div style="color:red; margin-bottom:15px;">
    {{ form.non_field_errors }}
</div>
{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        <label>Department</label>
        {{ form.department }}
    </p>

    <p>
        <label>Doctor</label>
        {{ form.doctor }}
    </p>

    <p>
        <label>Appointment Date</label>
        {{ form.appointment_date }}
    </p>

    <p>
        <label>Appointment Time</label>
        {{ form.appointment_time }}
    </p>

    <button type="submit">
        Confirm Appointment
    </button>

</form>

<script>

// Department → Doctor Filtering
document.getElementById("id_department").addEventListener("change", function () {
    this.form.submit();
});


// Doctor → Available Dates (Flatpickr)
document.getElementById("id_doctor").addEventListener("change", function () {

    let doctorId = this.value;

    if (doctorId != "") {

        fetch("/doctor-dates/" + doctorId + "/")

        .then(response => response.json())

        .then(function (availableDates) {

            flatpickr("#id_appointment_date", {

                dateFormat: "Y-m-d",

                enable: availableDates

            });

        });

    }

});

</script>

{% endblock %}
