{% extends 'base.html' %}

{% block content %}

<h2>View Doctors</h2>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Specialization</th>
    </tr>

    {% for doctor in doctors %}
    <tr>
        <td>{{ doctor.name }}</td>
        <td>{{ doctor.email }}</td>
        <td>{{ doctor.phone }}</td>
        <td>{{ doctor.department }}</td>
        <td>{{ doctor.specialization }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
