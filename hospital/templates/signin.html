{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">Login</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>

    <p class="register-link">
        New Patient?
        <a href="{% url 'patient_register' %}">
            Register Here
        </a>
    </p>

</form>

{% endblock %}
