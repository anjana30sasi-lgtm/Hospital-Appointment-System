{% extends 'base.html' %}

{% block content %}

<h2>View Patients</h2>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
    </tr>

    {% for patient in patients %}
    <tr>
        <td>{{ patient.name }}</td>
        <td>{{ patient.age }}</td>
        <td>{{ patient.email }}</td>
        <td>{{ patient.phone }}</td>
        <td>{{ patient.address }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
