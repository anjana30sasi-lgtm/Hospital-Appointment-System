{% extends 'base.html' %}

{% block content %}

<h2>Departments</h2>
<a href="{% url 'add_department' %}" class="add-btn">
    + Add Department
</a>
<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>

    {% for department in departments %}
<tr>
    <td>{{ department.id }}</td>
    <td>{{ department.name }}</td>

    <td>
        <a href="#">Edit</a> |
        <a href="#">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
