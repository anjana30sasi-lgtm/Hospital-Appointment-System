{% extends 'base.html' %}

{% block content %}

<h2 class="form-title">Manage Availability</h2>

<form method="post">

    {% csrf_token %}

    <label>Doctor</label><br>


<input
    type="text"
    value="{{ doctor.name }}"
    readonly
>
    <br><br>

    <label>Date</label><br>

    <input type="date" name="date">

    <br><br>

    <label>Status</label><br>

    <select name="status">

        <option value="Available">
            Available
        </option>

        <option value="Not Available">
            Not Available
        </option>

        <option value="On Leave">
            On Leave
        </option>

    </select>

    <br><br>

    <button type="submit">
        Save
    </button>

</form>

{% endblock %}
