{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">Prescription & Notes</h2>

<table>
    <thead>
        <tr>
            <th>Doctor</th>
            <th>Notes</th>
            <th>Prescription</th>
        </tr>
    </thead>

    <tbody>
        {% for appointment in appointments %}
        <tr>
            <td>{{ appointment.doctor.name }}</td>
            <td>{{ appointment.notes }}</td>
            <td>{{ appointment.prescription }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">
                No prescriptions available
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
